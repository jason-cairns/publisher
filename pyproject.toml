[project]
name = "publication-site"
version = "0.1.0"
description = "Small Typst-first publication site generator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5.0",
  "networkx>=3.0",
  "typst>=0.14.0",
]

[project.scripts]
site = "publication_site.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "ty>=0.0.1a14",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src_py"]

[tool.uv.build-backend]
module-root = "src_py"
